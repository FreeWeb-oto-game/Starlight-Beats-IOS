name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/DerivedData/Build/Products/Debug-iphoneos/App.app build/ipa/Payload/App.app
          mkdir -p artifacts
          cd build/ipa
          zip -qry ../../artifacts/StarlightBeats-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: starlight-beats-ios-unsigned
          path: artifacts/StarlightBeats-unsigned.ipa
          if-no-files-found: error
